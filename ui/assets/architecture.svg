<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 780" role="img" aria-labelledby="flow-t flow-d" class="fig-arch"><title id="flow-t">How the six engines connect, and how far each is built</title><desc id="flow-d">Six engines and their state. TOPOHYDRO feeds XYLEM, MNEME and MERISTEM. XYLEM&#x27;s mechanistic hazard goes to REFUGIUM; MNEME and the area-of-applicability gate are built but not active; MERISTEM&#x27;s treeline is run and its growth terms are not. REFUGIUM feeds AEGIS, the decision layer. Uncertainty and validation apply to every arrow.</desc><style>
.node{stroke:var(--svg-line,#16365C);stroke-width:1.1}
.node.dash{stroke-dasharray:5 3}
.n-run{fill:var(--svg-run,#D9EFE3)}
.n-red{fill:var(--svg-reduced,#FBF0CF)}
.n-built{fill:var(--svg-built,#EAF0F6)}
.n-none{fill:var(--svg-none,#F6DAD3)}
.n-drv{fill:var(--svg-drv,#F4EFE6)}
.n-cross{fill:var(--svg-paper,#FFFFFF);stroke:var(--svg-mute,#4B5563)}
.ttl{font-weight:700;fill:var(--svg-ink,#16365C)}
.txt,.sub{fill:var(--svg-ink,#1E293B)}
.sub{font-style:italic;fill:var(--svg-mute,#4B5563)}
.lab{font-style:italic;fill:var(--svg-mute,#4B5563)}
.arr{fill:none;stroke:var(--svg-mute,#4B5563);stroke-width:1.3}
.arr.dash{stroke-dasharray:5 4}
#ah path{fill:var(--svg-mute,#4B5563)}
text{font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif}
</style><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z"/></marker></defs><rect class="node n-drv" x="100.8" y="19.3" width="686.4" height="49.4" rx="5"/><text class="ttl" x="444.0" y="40.7" text-anchor="middle" font-size="12.6">Drivers</text><text class="txt" x="444.0" y="55.3" text-anchor="middle" font-size="11.2">CHELSA-daily 2019 · ISIMIP3a/3b · ERA5-Land · SRTM 30 m · SoilGrids · stations</text><rect class="node n-run" x="199.6" y="107.7" width="488.8" height="65.0" rx="5"/><text class="ttl" x="444.0" y="129.6" text-anchor="middle" font-size="12.6">TOPOHYDRO — topoclimate and water balance</text><text class="txt" x="444.0" y="144.2" text-anchor="middle" font-size="11.2">T, VPD, R<tspan dy="2.5" font-size="8.1">n</tspan><tspan dy="-2.5">​</tspan>, PET × 3, snow, soil bucket per species group</text><text class="txt" x="444.0" y="158.8" text-anchor="middle" font-size="11.2">→ CWD, WSI, ψ<tspan dy="2.5" font-size="8.1">s</tspan><tspan dy="-2.5">​</tspan>, GDD, late frost, GST</text><path class="arr" d="M444.0,69.0 L444.0,107.4" marker-end="url(#ah)"/><rect class="node n-run" x="12.4" y="235.1" width="260.0" height="111.8" rx="5"/><text class="ttl" x="142.4" y="265.8" text-anchor="middle" font-size="12.6">XYLEM — hydraulic failure</text><text class="txt" x="142.4" y="280.4" text-anchor="middle" font-size="11.2">vulnerability curve, stomatal closure,</text><text class="txt" x="142.4" y="295.0" text-anchor="middle" font-size="11.2">g<tspan dy="2.5" font-size="8.1">min</tspan><tspan dy="-2.5">​</tspan>(T) heat transition, HFI</text><text class="txt" x="142.4" y="309.6" text-anchor="middle" font-size="11.2">50 × 200 trait draws → h<tspan dy="-3.6" font-size="8.1">mech</tspan><tspan dy="3.6">​</tspan></text><text class="sub" x="142.4" y="324.2" text-anchor="middle" font-size="11.2">traits: XFT P<tspan dy="2.5" font-size="8.1">50</tspan><tspan dy="-2.5">​</tspan>, S; others placeholder</text><rect class="node n-built" x="314.0" y="235.1" width="260.0" height="111.8" rx="5"/><text class="ttl" x="444.0" y="265.8" text-anchor="middle" font-size="12.6">MNEME — mortality hazard</text><text class="txt" x="444.0" y="280.4" text-anchor="middle" font-size="11.2">cloglog panel model, within/between,</text><text class="txt" x="444.0" y="295.0" text-anchor="middle" font-size="11.2">lags; GLM + monotone GBM stack → h<tspan dy="-3.6" font-size="8.1">stat</tspan><tspan dy="3.6">​</tspan></text><text class="sub" x="444.0" y="309.6" text-anchor="middle" font-size="11.2">dieback labels built; 0 events in the</text><text class="sub" x="444.0" y="324.2" text-anchor="middle" font-size="11.2">sampled panel, so not fitted</text><rect class="node n-red" x="615.6" y="235.1" width="260.0" height="111.8" rx="5"/><text class="ttl" x="745.6" y="265.8" text-anchor="middle" font-size="12.6">MERISTEM — niche, treeline, growth</text><text class="txt" x="745.6" y="280.4" text-anchor="middle" font-size="11.2">niche per species and treeline z<tspan dy="2.5" font-size="8.1">tl</tspan><tspan dy="-2.5">​</tspan>: run</text><text class="txt" x="745.6" y="295.0" text-anchor="middle" font-size="11.2">height H*, growth, establishment:</text><text class="txt" x="745.6" y="309.6" text-anchor="middle" font-size="11.2">built, not fitted</text><text class="sub" x="745.6" y="324.2" text-anchor="middle" font-size="11.2">niche inputs: CHELSA-BIOCLIM+, GBIF, soils</text><path class="arr" d="M267.2,173.0 L267.2,189.6 L142.4,189.6 L142.4,234.8" marker-end="url(#ah)"/><text class="lab" x="147.6" y="184.4" font-size="10.2">ψ<tspan dy="2.2" font-size="7.3">s</tspan><tspan dy="-2.2">​</tspan>, VPD, T</text><path class="arr" d="M444.0,173.0 L444.0,234.8" marker-end="url(#ah)"/><text class="lab" x="449.2" y="202.6" font-size="10.2">annual CWD, VPD, GDD, T</text><path class="arr" d="M620.8,173.0 L620.8,189.6 L745.6,189.6 L745.6,234.8" marker-end="url(#ah)"/><text class="lab" x="750.8" y="184.4" font-size="10.2">GST (treeline only)</text><rect class="node n-built dash" x="303.6" y="383.3" width="280.8" height="59.8" rx="5"/><text class="ttl" x="444.0" y="402.6" text-anchor="middle" font-size="12.6">Area-of-applicability gate</text><text class="txt" x="444.0" y="417.2" text-anchor="middle" font-size="11.2">h = w h<tspan dy="-3.6" font-size="8.1">stat</tspan><tspan dy="3.6">​</tspan> + (1 − w) h<tspan dy="-3.6" font-size="8.1">mech</tspan><tspan dy="3.6">​</tspan>  (link scale)</text><text class="sub" x="444.0" y="431.8" text-anchor="middle" font-size="11.2">built; inactive until h<tspan dy="-3.6" font-size="8.1">stat</tspan><tspan dy="3.6">​</tspan> exists</text><path class="arr dash" d="M444.0,347.2 L444.0,382.0" marker-end="url(#ah)"/><path class="arr dash" d="M267.2,347.2 L267.2,413.2 L303.6,413.2" marker-end="url(#ah)"/><rect class="node n-red" x="199.6" y="484.7" width="488.8" height="65.0" rx="5"/><text class="ttl" x="444.0" y="506.6" text-anchor="middle" font-size="12.6">REFUGIUM — viability, refugia, analogues</text><text class="txt" x="444.0" y="521.2" text-anchor="middle" font-size="11.2">V<tspan dy="-3.6" font-size="8.1">(1)</tspan><tspan dy="3.6">​</tspan> = 1 − h<tspan dy="-3.6" font-size="8.1">mech</tspan><tspan dy="3.6">​</tspan>; robust refugium, criterion (a); risk-averse score</text><text class="sub" x="444.0" y="535.8" text-anchor="middle" font-size="11.2">other hazards, height factor, criteria (b), (c), analogues: not computed</text><path class="arr" d="M142.4,347.2 L142.4,465.2 L236.0,465.2 L236.0,484.4" marker-end="url(#ah)"/><text class="lab" x="147.6" y="426.2" font-size="10.2">h<tspan dy="-3.3" font-size="7.3">mech</tspan><tspan dy="3.3">​</tspan> (used)</text><path class="arr dash" d="M444.0,443.4 L444.0,484.4" marker-end="url(#ah)"/><text class="lab" x="449.2" y="465.2" font-size="10.2">h<tspan dy="-3.3" font-size="7.3">hyd</tspan><tspan dy="3.3">​</tspan></text><path class="arr dash" d="M745.6,347.2 L745.6,465.2 L652.0,465.2 L652.0,484.4" marker-end="url(#ah)"/><text class="lab" x="750.8" y="426.2" font-size="10.2">H*, growth, h<tspan dy="-3.3" font-size="7.3">est</tspan><tspan dy="3.3">​</tspan></text><rect class="node n-red" x="199.6" y="582.2" width="488.8" height="52.0" rx="5"/><text class="ttl" x="444.0" y="604.9" text-anchor="middle" font-size="12.6">AEGIS — decision layer</text><text class="txt" x="444.0" y="619.5" text-anchor="middle" font-size="11.2">CVaR-robust species × method portfolio (MILP), 45 members</text><path class="arr" d="M444.0,550.0 L444.0,582.2" marker-end="url(#ah)"/><rect class="node n-cross" x="2.0" y="664.1" width="421.2" height="59.8" rx="5"/><text class="ttl" x="212.6" y="683.4" text-anchor="middle" font-size="12.6">Uncertainty</text><text class="txt" x="212.6" y="698.0" text-anchor="middle" font-size="11.2">SSP × GCM × horizon × traits: carried (run)</text><text class="txt" x="212.6" y="712.6" text-anchor="middle" font-size="11.2">ANOVA and Sobol&#x27; partition: built, not applied</text><rect class="node n-cross" x="464.8" y="664.1" width="421.2" height="59.8" rx="5"/><text class="ttl" x="675.4" y="683.4" text-anchor="middle" font-size="12.6">Validation</text><text class="txt" x="675.4" y="698.0" text-anchor="middle" font-size="11.2">niche block CV, synthetic extrapolation test: run</text><text class="txt" x="675.4" y="712.6" text-anchor="middle" font-size="11.2">hazard CV, conformal, design-based: built</text><rect class="node n-run" x="18.0" y="740.2" width="18" height="14" rx="3"/><text class="txt" x="43.0" y="751.2" font-size="11">run, in the results</text><rect class="node n-red" x="184.7" y="740.2" width="18" height="14" rx="3"/><text class="txt" x="209.7" y="751.2" font-size="11">run, reduced scope</text><rect class="node n-built" x="345.1" y="740.2" width="18" height="14" rx="3"/><text class="txt" x="370.1" y="751.2" font-size="11">built and tested, not applied</text><rect class="node n-none" x="574.8" y="740.2" width="18" height="14" rx="3"/><text class="txt" x="599.8" y="751.2" font-size="11">not built</text><path class="arr dash" d="M678.5,747.2 L704.5,747.2" marker-end="url(#ah)"/><text class="txt" x="711.5" y="751.2" font-size="11">dashed: not active</text></svg>

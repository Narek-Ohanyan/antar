[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antar"
version = "2.0.0a0"
description = "ANTAR: hybrid process-statistical framework for predicting climate-resilient reforestation refugia in Armenia"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.4", "pyyaml"]

[project.optional-dependencies]
geo = ["xarray", "rioxarray", "rasterio", "geopandas", "dask", "zarr", "netcdf4", "pyarrow"]
gee = ["earthengine-api"]
bayes = ["pymc>=5", "arviz"]
ml = ["xgboost", "lightgbm", "shap", "mapie"]
workflow = ["snakemake", "dvc", "mlflow"]
dev = ["pytest", "ruff", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

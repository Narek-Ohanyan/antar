# Scenario and ensemble design (see Concept Document, Section 10)
#
# 2026-09-24: two data-source decisions, both reconnaissance-driven (read the actual archive,
# never assumed):
#
# (1) Historical reference: native CHELSA-daily (chelsa-climate.org / os.unil.cloud.switch.ch/
#     chelsa02/chelsa/global/daily/), NOT the hyperion CORDEX output -- hyperion's tree is CORDEX
#     regional-model output bias-adjusted *using* CHELSA as a reference, not CHELSA itself, and
#     was missing tasmax/tasmin entirely. Real CHELSA-daily has pr/tas/tasmax/tasmin directly,
#     confirmed via HTTP range-request access to the public COGs (no bulk download): tas/tasmax/
#     tasmin 1979-2024, pr 1979-2019 (archive's own "active (incomplete)" status; confirmed gap,
#     not assumed). 1979 start (not 2000) so the pull actually covers reference_period below,
#     which the first attempt at this did not.
# (2) Future projections: kept on the hyperion CORDEX/CMIP5/RCP pull (see the gcms: block below),
#     per explicit decision -- CORDEX for the future horizon, CHELSA-daily for the historical
#     reference, rather than mixing sources within the same time window.
#
# See IMPLEMENTATION_LOG.md for both reconnaissance passes and a real bug caught in the CHELSA
# pull (filenames are DD_MM_YYYY, not MM_DD_YYYY -- verified empirically via the actual seasonal
# temperature signal before trusting the naive guess).
#
# 2026-09-30: future-projection ensemble decision (user's explicit choice, ROADMAP.md S1.1) --
# run CORDEX/CMIP5 (hyperion) AND NASA/GDDP-CMIP6 + ISIMIP3b (both confirmed directly accessible,
# no institutional gate) as two SEPARATE, LABELLED ensembles rather than picking one or silently
# merging them. See future_ensembles: below. This is the most scientifically thorough option
# (captures structural uncertainty across CMIP generations) at the cost of roughly double the
# future-projection workload -- accepted deliberately, not a default.

reference_period: [1991, 2020]      # fixed reference for SPEI / anomalies (future is standardised against it);
                                     # now actually covered by the CHELSA-daily pull (1979-2024/2019)
calibration_period: [2000, 2024]    # hazard-model (MNEME) training window specifically -- tied to Landsat/HLS-era
                                     # satellite coverage for dieback detection, not the climatological data itself
horizons: [2050, 2080, 2100]        # 20-year windows centred on these years

historical_source:
  dataset: "CHELSA-daily V2.1"
  url: "https://os.unil.cloud.switch.ch/chelsa02/chelsa/global/daily/"
  citation: "Karger, D. N. (2025). CHELSA-daily climate data at high resolution. EnviDat. https://www.doi.org/10.16904/envidat.687."
  license: "CC0 1.0"
  variables:
    tas: {years: [1979, 2024], status: present}
    tasmax: {years: [1979, 2024], status: present}
    tasmin: {years: [1979, 2024], status: present}
    pr: {years: [1979, 2019], status: "present through 2019; gap 2020-2024 in the source archive itself"}
  access_method: >
    Cloud-Optimized GeoTIFF, one global file per variable per day, accessed via HTTP range
    requests (GDAL /vsicurl/) for Armenia's window only -- no full-file download. ~0.3 s per
    file confirmed.

scenarios:
  primary: [rcp26, rcp85, ssp126, ssp370, ssp585]   # union across both ensembles -- see future_ensembles: below
                                                      # for which scenarios exist in which ensemble
  overshoot_where_available: []     # neither CMIP5/RCP nor the CMIP6/SSP sources pulled here include a
                                     # ScenarioMIP-style overshoot pathway for this bbox; Sec. 10.1's overshoot
                                     # stress test (SSP5-3.4-OS) is dropped, not substituted
  storyline_note: >
    RCP8.5/SSP5-8.5 are treated as high-end stress tests, not forecasts (Hausfather & Peters 2020's caution
    about "business as usual" framing applies to both).
  rcp_ssp_correspondence: >
    RCPs (CMIP5) and SSPs (CMIP6) are related but NOT interchangeable by matching number -- see
    configs/co2_concentration_pathways.csv for the real forcing numbers: rcp26 and ssp126 both stay low but
    diverge (~421 vs ~446 ppm CO2 by 2100), rcp85 and ssp585 diverge much more sharply (~936 vs ~1135 ppm).
    Never plot or average an RCP-sourced and an SSP-sourced ensemble member together under a shared "low/high"
    label without checking this table first.

future_ensembles:
  role: "future projections only (2025 onward) -- the historical/reference period is served by CHELSA-daily above"
  decision_note: >
    2026-09-30, user's explicit choice (ROADMAP.md S1.1): run both ensembles below as separate, labelled
    members rather than picking one -- the most scientifically thorough option, accepted at the cost of
    roughly double the future-projection workload.

  cordex_cmip5:
    source: "CORDEX WAS-22 regional climate models, bias-adjusted; hyperion.wsl.ch:/storage/zilker/chelsaV2/output/Armenia/"
    scenarios: [rcp26, rcp85]         # the only RCPs found, present for every GCM below; no RCP4.5/RCP6.0 seen
    models: [MOHC-HadGEM2-ES, MPI-M-MPI-ESM-LR, MPI-M-MPI-ESM-MR, NCC-NorESM1-M]   # CMIP5; confirmed present on hyperion
    regional_models: [GERICS-REMO2015, ORNL-RegCM4-7]   # both seen on hyperion; which RCM backs which GCM x RCP
                                                          # combination varies (e.g. NCC-NorESM1-M carries both for
                                                          # some RCPs) and must be enumerated exactly in the data
                                                          # manifest before any pull, not assumed from this listing
    status: "2 of 4 variables (pr, tas) done for 1 of 8 GCM x RCP combinations (MOHC-HadGEM2-ES/rcp26); tasrange/
      tasskew for that combination plus the other 7 combinations still pending -- blocked on hyperion
      office-network/VPN access (confirmed DNS-unreachable from outside it, IMPLEMENTATION_LOG.md 2026-09-28)."
    hot_model_policy: >
      Not yet restated for CMIP5: the concept note's ECS-based screening (Zelinka et al. 2020; Hausfather et al.
      2022) is CMIP6-specific and its numbers do not carry over to these CMIP5 models. Needs its own
      literature-sourced ECS values per model before an equivalent policy can be written here -- flagged rather
      than guessed at.
    members: "use all available realisations per model to sample internal variability"
    bias_adjustment_note: >
      Filenames on hyperion (*_sim_hist_ba.nc, weights_pr.nc, *_qm_transfer_plot.png) indicate this RCM output is
      already empirical-quantile-mapping bias-adjusted upstream, most likely against CHELSA itself as the
      observational reference -- not confirmed. This differs from Sec. 5.1's assumption that raw ISIMIP3b arrives
      already trend-preserving and only needs QDM against ERA5-Land: antar.climate.bias.quantile_delta_mapping
      applied to this data would be correcting an already-adjusted product, not a raw GCM field. Confirm the exact
      upstream reference before wiring this data through TOPOHYDRO's bias-adjustment step.

  cmip6:
    source_primary: "ISIMIP3b via data.isimip.org's Files API v2 (NOT the outdated cutout_bbox() wrapper in
      the isimip-client pip package, which sends a request shape the live API rejects -- the correct payload
      is {'paths': [...], 'operations': [{'operation': 'cutout_bbox', 'bbox': [lon_min, lon_max, lat_min,
      lat_max]}]} posted to files.isimip.org/api/v2, built directly). CONFIRMED WORKING END TO END
      2026-09-30: submitted a real job, polled to completion, downloaded and opened the resulting NetCDF --
      correct coordinates (lat 39.25-41.25, lon 43.75-46.25) and physically plausible daily tas
      (-30.7 to 32.1 degC, GFDL-ESM4/ssp126/2015-2020). The bbox axis order is [lon_min, lon_max, lat_min,
      lat_max], not the [south, north, west, east]-style order first assumed -- caught by checking the
      output file's actual coordinates against Armenia's known extent, not trusted from the job succeeding
      alone (the wrong order also 'succeeds', just for the wrong region -- northern Georgia/southern Russia
      in the first attempt). Has exactly the concept note's intended scenario set (ssp126/370/585) and the
      original 5-GCM ensemble -- no substitution needed."
    source_secondary: "NASA/GDDP-CMIP6 on Google Earth Engine (ee.ImageCollection('NASA/GDDP-CMIP6')).
      CONFIRMED (2026-09-30, queried the collection directly): only historical/ssp245/ssp585 actually exist
      in this EE ingestion -- ssp126 and ssp370 are absent (0 images), despite NASA's own archive having all
      four. Kept as a secondary, broader-GCM (34 models) cross-check restricted to ssp245/ssp585, not as the
      primary CMIP6 source. Full 4-SSP archive exists at AWS s3://nex-gddp-cmip6 if ever needed instead of EE.
      asset id is NASA/GDDP-CMIP6, not NEX-GDDP-CMIP6, if a fresh EE query is written."
    scenarios: [ssp126, ssp245, ssp370, ssp585]
    models_isimip3b: [GFDL-ESM4, IPSL-CM6A-LR, MPI-ESM1-2-HR, MRI-ESM2-0, UKESM1-0-LL]   # the concept note's
                                                                                            # original 5 ISIMIP3b models
    resolution: "0.25 deg (NASA/GDDP-CMIP6) or 0.5 deg (ISIMIP3b) -- coarser than CORDEX's WAS-22 regional
      downscaling; needs its own regridding-to-master-grid step, not assumed equivalent."
    bias_adjustment_note: "NASA/GDDP-CMIP6 is already bias-corrected (BCSD method). ISIMIP3b is bias-adjusted
      against W5E5 v1.0. Neither needs antar.climate.bias.quantile_delta_mapping re-applied as a raw-GCM
      correction step -- same caution as the CORDEX note above, for a different reason."
    status: "Access confirmed working end to end 2026-09-30; full pull not yet run."

structural_ensemble:
  pet_formulations: [pm_fao56, canopy_pm_co2, priestley_taylor, energy_only]
  downscaling: [delta_change_factor, qdm_trend_preserving]
  soil_parameter_draws: 50
  trait_draws: 200

primary_variable_status:              # Table 4's "pr, tas, tasmax, tasmin"
  historical: {pr: present, tas: present, tasmax: present, tasmin: present}   # CHELSA-daily, direct
  future_cordex_hyperion:
    pr: present
    tas: present
    tasrange: present                 # diurnal range; not itself a Table 4 primary variable
    tasskew: present                  # skewness parameter; not itself a Table 4 primary variable
    tasmax: absent                    # directory exists on hyperion but holds no files
    tasmin: absent                    # directory exists on hyperion but holds no files
  # For the future period, tasmax/tasmin have no direct CORDEX source on hyperion and must be
  # derived from tas + tasrange (min/max around the mean, tasskew informing the asymmetry) --
  # not yet implemented; a real follow-up, not a silent gap.
  future_cmip6:
    pr: present
    tas: present
    tasmax: present                   # NASA/GDDP-CMIP6 carries tasmax/tasmin directly -- CORDEX's
    tasmin: present                   # gap above does not apply to this ensemble at all
  # Access confirmed 2026-09-30 (NASA/GDDP-CMIP6 EE catalog, ISIMIP3b via isimip-client); no
  # actual pull run yet, so "present" here means "confirmed available to pull", not "pulled".

legacy_data_note: >
  A version1/ subtree under the same Armenia/ directory holds derived indices (tmean/pr seasonal and annual
  summaries, GDD days, r10mm/r20mm, CDD/CWD) per GCM x RCP. This reads as the prior project's own v1 pipeline
  output and is not primary forcing data for this framework.

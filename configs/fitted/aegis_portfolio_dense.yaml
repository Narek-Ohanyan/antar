cost_table:
- name: degraded_forest_planting
  cost_per_ha: 6800.0
  cost_low: 3300.0
  cost_high: 12600.0
  cost_basis: sourced_armenian_cost_data
  source: 'Central: 2.6 million AMD per hectare, the Ministry of Environment''s average
    cost to establish a hectare of forest including five years of maintenance, mowing,
    fencing and nursery work (Hetq, 1 December 2025; about US$6,800 at that article''s
    own conversion). Low: EUR 2,945 per hectare, planting with survival taken into
    account, KfW ex-post evaluation of the IKI Caucasus natural-forest programme (2017;
    about US$3,300, prices of 2013-2016). High: about US$12,600 per hectare, the items
    of an itemised intensive planting site in Armenia''s Adaptation Fund proposal
    (2025), excluding irrigation and soil works.'
  role: restoration
- name: natural_regeneration
  cost_per_ha: 186.0
  cost_basis: sourced_cheapest_mix
  source: 'World Bank (2023): the cheapest real option mix, US$9.3 million for 50,000
    ha; the KfW evaluation also finds natural regeneration much cheaper than planting,
    fencing being the main cost.'
  role: restoration
- name: coppicing_oak
  cost_per_ha: 186.0
  cost_basis: sourced_cheapest_mix
  source: 'World Bank (2023): the cheapest real option mix (shared with natural regeneration
    and wildfire prevention).'
  role: forest_management

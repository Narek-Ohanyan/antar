scope_note: 'A planting unit is the grid cell around a model node (about 3,200 ha
  on the dense grid), treated whole or not at all, with the node''s viability and
  eligibility standing for the whole cell. Only the four restoration methods are ranked,
  and each acts on the cell''s open land (its area minus forest, woodland and water,
  from the national Ecosystem Map averaged over the cell); a cell needs at least 10%
  open land. A species group is ranked only if a MERISTEM niche model passes the quality
  gate (mean Boyce index at least 0.30), and it is eligible in a cell only where that
  model puts it within its niche today; in a scenario member in which the cell leaves
  the niche its benefit there is zero. Benefit varies only by functional group (REFUGIUM
  viability times niche support) times one national value, 417 USD/ha/yr x 75% (the
  share a restored degraded hectare adds, World Bank 2023); cost varies only by intervention
  method -- the two are independent by construction since no real data or model connects
  method to survival. An optional cap limits the share of the treated area that one
  species group may take. Planting uses Armenian cost data (range shown); the other
  restoration methods use World Bank 2023 figures (cheapest mix, an all-method average,
  the most expensive option). Coppicing, pine thinning and wildfire prevention act
  on existing forest and are not ranked: no figure exists for the benefit of maintaining
  forest. Mining reclamation is not ranked: there is no data on where the sites are.
  Water use, water caps and basins are omitted: no real figure exists for any option''s
  water use. Eligibility = real WDPA (not protected) AND real Ecosystem Map human-modified
  exclusion (not >50% settlements/cropland/buildings/quarries in a local 500 m window).'

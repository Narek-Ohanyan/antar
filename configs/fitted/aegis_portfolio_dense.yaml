cost_table:
- name: degraded_forest_planting
  cost_per_ha: 6800.0
  cost_low: 3300.0
  cost_high: 12600.0
  cost_basis: sourced_armenian_cost_data
  source: 'Central: 2.6 million AMD per hectare, the Ministry of Environment''s average
    cost to establish a hectare of forest including five years of maintenance, mowing,
    fencing and nursery work (Hetq, 1 December 2025; about US$6,800 at that article''s
    own conversion). Low: EUR 2,945 per hectare, planting with survival taken into
    account, KfW ex-post evaluation of the IKI Caucasus natural-forest programme (2017;
    about US$3,300, prices of 2013-2016). High: about US$12,600 per hectare, the items
    of an itemised intensive planting site in Armenia''s Adaptation Fund proposal
    (2025), excluding irrigation and soil works.'
- name: natural_regeneration
  cost_per_ha: 186.0
  cost_basis: sourced_cheapest_mix
  source: 'World Bank (2023): the cheapest real option mix, US$9.3 million for 50,000
    ha; the KfW evaluation also finds natural regeneration much cheaper than planting,
    fencing being the main cost.'
- name: coppicing_oak
  cost_per_ha: 186.0
  cost_basis: sourced_cheapest_mix
  source: 'World Bank (2023): the cheapest real option mix (shared with natural regeneration
    and wildfire prevention).'
- name: pine_thinning
  cost_per_ha: 900.0
  cost_basis: blended
  source: 'World Bank (2023): the average over all eight options, US$45 million for
    50,000 ha; no individual figure found.'
- name: wildfire_prevention
  cost_per_ha: 186.0
  cost_basis: sourced_cheapest_mix
  source: 'World Bank (2023): the cheapest real option mix (shared with natural regeneration
    and coppicing).'
- name: anti_erosion_plantation
  cost_per_ha: 900.0
  cost_basis: blended
  source: 'World Bank (2023): the average over all eight options; no individual figure
    found.'
- name: windbreaks_hedgerows
  cost_per_ha: 13260.0
  cost_basis: sourced_most_expensive
  source: 'World Bank (2023): the most expensive single option, US$663 million for
    50,000 ha.'
- name: mining_site_reclamation
  cost_per_ha: 900.0
  cost_basis: blended
  source: 'World Bank (2023): the average over all eight options; no individual figure
    found.'
scope_note: A planting unit is the grid cell around a model node (about 3,000 ha on
  the dense grid), treated whole or not at all, with the node's viability and eligibility
  standing for the whole cell. Benefit varies only by functional group (REFUGIUM viability)
  times one national value, 417 USD/ha/yr x 75% (the share a restored degraded hectare
  adds, World Bank 2023); cost varies only by intervention method -- the two are independent
  by construction since no real data or model connects method to viability. Planting
  uses Armenian cost data (range shown); 3 of 8 methods use a blended real average
  cost (no individual figure was found) and 3 share the cheapest-mix figure -- see
  cost_table. water_use/water_caps/basin intentionally omitted -- no real figure exists
  for any planting option's water use. Eligibility = real WDPA (not protected) AND
  real Ecosystem Map of Armenia human-modified exclusion (not >50% settlements/cropland/buildings/quarries
  in a local 500m window) -- deliberately does NOT exclude already-forested cells,
  since 3 of the 8 real methods (coppicing_oak, pine_thinning, wildfire_prevention)
  target existing forest.

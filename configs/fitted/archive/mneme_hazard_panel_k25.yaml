rule: z < -2 against the pixel's own previous 10 years, starting a decline (previous
  year not below -2), no harvest or fire flag in the year or the year before, and
  no recovery above -1 in the next 2 years; first onset only
scope_note: 'Climate-only Mundlak design (cwd_mm, vpd24_mean_kpa, gdd_annual, t_mean_c_annual,
  each split within/between by climate cell) plus the 2019 canopy height of the pixel;
  no stand age, lagged-drought cross-basis or stand-interaction terms, because no
  such data exist for Armenian plots. Misclassification correction (Se/Sp) is not
  applied: no labelled sample exists. Pixels of one cell share their climate, so person-years
  are not independent and the event-rate interval is narrower than the data justify.'
status: too_few_events_for_a_hazard_fit

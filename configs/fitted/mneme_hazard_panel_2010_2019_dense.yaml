  note: 'the dieback rule on the vitality series alone (harvest/fire flags ignored),
    and on the mirrored series, which counts persistent rises; clearly more declines
    than rises would be the signature of real dieback. In the real record rises outnumber
    declines: the unadjusted series carries a sensor-driven upward step, so the rule
    is not read as a dieback detector without the year-effect-removed variant'

scope_note: Local 500m-radius class-fraction sample at the real 78-cell grid, NOT
  a representation of the full ~30km grid-cell spacing. Validation correlates REFUGIUM's
  predicted viability against real observed nearby forest-class cover -- an honest
  check, not a retraining; juniper has no real REFUGIUM viability to correlate against
  (XYLEM/REFUGIUM both skipped it for lack of real trait variance) so only its real
  observed cover is reported. 17/78 real cells fall outside Armenia's real national
  border (the project's rectangular BBOX extends past it) and have no coverage here
  -- left unset, not zero-filled.

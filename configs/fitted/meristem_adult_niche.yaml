fit_date: '2026-09-30'
method: Per-species penalised (L2) presence-background logistic regression (antar.niche.adult.fit_presence_background),
  spatial-block CV (5-fold, 0.25deg blocks), scored with the continuous Boyce index.
background_type: GBIF target-group (Plantae, Armenia, excluding target species) --
  not uniform random, shared across all species' fits.
n_background_total: 3000
features:
- bio06_winter_min_C
- gdd5
- vpdmean_Pa
- cwd_approx_mm
- clay_0_30cm_mean
- sand_0_30cm_mean
- silt_0_30cm_mean
- soc_0_30cm_mean
cwd_caveat: cwd_approx_mm = petmean - bio12 (annual, CHELSA-BIOCLIM+), a simplified
  proxy -- not the real AET-based CWD, which needs TOPOHYDRO's full water balance
  (not yet run against real data). Replace once that exists.
pooling_note: An earlier version of this fit pooled all 7 species into one presence
  class and got a weak, unstable result (mean Boyce 0.25, one fold negative) -- diagnosed
  as pooling ecologically disparate species (beech/oak/pine/juniper have very different
  niches), not noise; refit per species to match the concept note's actual specification.

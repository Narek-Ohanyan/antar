scope_note: Benefit varies only by functional group (real, REFUGIUM); cost varies
  only by intervention method (real, World Bank/government source) -- the two are
  independent by construction since no real data or model connects method to viability.
  4 of 8 methods use a blended real average cost (not individually sourced) -- see
  option_labels' cost_basis per entry. water_use/water_caps/basin intentionally omitted
  -- no real figure exists for any planting option's water use. Eligibility = real
  WDPA (not protected) AND real Ecosystem Map of Armenia human-modified exclusion
  (not >50% settlements/cropland/buildings/quarries in a local 500m window) -- deliberately
  does NOT exclude already-forested cells, since 3 of the 8 real methods (coppicing_oak,
  pine_thinning, wildfire_prevention) target existing forest.

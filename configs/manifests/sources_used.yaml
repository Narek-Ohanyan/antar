- variable: isimip3a_obsclim_gswp3_w5e5_atmosphere
  source: ISIMIP3a observation-based climate input data (GSWP3-W5E5), ISIMIP Repository
  version: ISIMIP3a obsclim
  url: https://data.isimip.org/
  citation: ISIMIP3a obsclim atmospheric climate input data, GSWP3-W5E5 (daily, 2011-2019), ISIMIP Repository, https://data.isimip.org/ ; built on GSWP3 (Kim, H. 2017, Global Soil Wetness Project Phase
    3 Atmospheric Boundary Conditions, https://doi.org/10.20783/DIAS.501) adjusted to W5E5 (Lange, S. 2019, WFDE5 over land merged with ERA5 over the ocean, https://doi.org/10.5880/pik.2019.023)
  license: CC BY 4.0
  access_date: '2026-10-06'
  notes: Gives the seasonal shape of shortwave, longwave, wind and vapour pressure (baseline 2015-2019); the ISIMIP3b change factors are in the isimip3b manifest.

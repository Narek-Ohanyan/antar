  access_date: '2026-09-30'
- variable: srtm_elevation
  source: Shuttle Radar Topography Mission 1 arc-second (NASA/USGS), via Google Earth Engine
  version: USGS/SRTMGL1_003
  url: https://doi.org/10.1029/2005RG000183
  citation: Farr, T.G., Rosen, P.A., Caro, E., Crippen, R., Duren, R., Hensley, S., Kobrick, M., Paller, M., Rodriguez, E., Roth, L., Seal, D., Shaffer, S., Shimada, J., Umland, J., Werner, M., Oskin, M.,
    Burbank, D., Alsdorf, D. (2007). The Shuttle Radar Topography Mission. Reviews of Geophysics 45, RG2004. https://doi.org/10.1029/2005RG000183
  license: public domain (NASA/USGS)

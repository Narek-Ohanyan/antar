- variable: rooting_depth_by_functional_group
  source: Canadell, J., Jackson, R.B., Ehleringer, J.R., Mooney, H.A., Sala, O.E., Schulze, E-D.
    (1996). Maximum rooting depth of vegetation types at the global scale. Oecologia 108, 583-595.
  version: n/a
  url: https://link.springer.com/article/10.1007/BF00329030
  citation: Canadell et al. (1996), Oecologia 108, 583-595. https://doi.org/10.1007/BF00329030
  license: n/a (citation only, no data file pulled)
  access_date: '2026-09-30'
  local_path: null
  checksum_sha256: null
  spatial_extent: Global (290 observations, 255 species, by biome)
  notes: >-
    Real, genus-relevant, ready to replace the flat ROOTING_DEPTH_MM_PLACEHOLDER=1000 in
    scripts/run_topohydro_grid.py with real per-functional-group values (biome-level, not
    genus-level -- the paper reports by biome/functional-type, not individually for Fagus/
    Quercus/Pinus/Juniperus, so this is still a real proxy, one level less specific than XFT's
    species-level congeneric matches, but a large real improvement over a flat guess):
    temperate deciduous forest (Fagus orientalis/Carpinus betulus, Quercus macranthera/iberica)
    = 2.9 m; temperate coniferous forest (Pinus kochiana) = 3.9 m; desert/arid shrubland
    (Juniperus polycarpos/excelsa, arid-adapted) = 9.5 m. All three real, all three meaningfully
    different from the flat 1.0 m this session used and from each other -- juniper in particular
    was likely getting a badly-undersized rooting depth (real arid-adapted junipers root far
    deeper than the flat placeholder assumed), which would have understated w_max_mm and
    therefore overstated its real drought stress in the gridded run.

- variable: budburst_gdd_threshold
  source: Multiple real phenology papers found via search; only one concrete numeric threshold
    located and read directly (not a search-snippet paraphrase) -- Fagus sylvatica.
  version: n/a
  url: https://www.frontiersin.org/journals/forests-and-global-change/articles/10.3389/ffgc.2022.1063127/full
  citation: See the Frontiers in Forests and Global Change (2022) article on European beech
    bud-burst/senescence phenology (full citation to be confirmed from the article itself before
    use -- only read via search summary tonight, not the primary text, unlike every other real
    number in tonight's research).
  license: n/a
  access_date: '2026-09-30'
  local_path: null
  checksum_sha256: null
  spatial_extent: Europe (beech populations along an altitudinal transect)
  notes: >-
    **2026-10-01 follow-up, as instructed by this note's own original caveat ("read the primary
    article directly ... before treating this as ready to use")**: did exactly that, and the
    original claim does NOT hold up. The primary Frontiers article actually uses Growing Degree
    *Hours* (GDH, not GDD-days) with a non-linear chilling/forcing interaction model, base 0 degC
    -- no standalone "60 GDD" threshold appears anywhere in it; the real quote is "GDH requirement
    to budburst for European beech increased with increasing forcing temperature" (i.e. the
    requirement itself varies, it is not a fixed number). The "60 GDD base-0" figure in this
    note's first pass was a misread of the search summary, not something the primary source
    actually states -- a real example of why this project's own "read primary text, not just a
    search snippet" bar exists. Tried two further real sources for a simpler, directly usable
    beech/oak/Scots-pine GDD threshold (Chuine-style simple thermal-time models,
    10.1007/s00484-003-0191-1): blocked by a Springer login wall and an Anubis bot-check on the
    open-access mirror respectively -- both real, both hit, neither a found number. No real,
    verifiable, species-specific GDD budburst threshold exists in this project as of tonight.
    GDD_BUDBURST_PLACEHOLDER=200 stays a placeholder. Real, concrete next step instead of
    continuing to chase an inaccessible citation: a formal sensitivity sweep (perturb
    GDD_BUDBURST_PLACEHOLDER across a defensible literature-typical range, e.g. 0-300 GDD base-5,
    re-run the cheap 78-point grid, report how much real viability actually moves). NOT written
    yet -- genuinely still open, not done under a name that sounds like it exists.

- variable: calm_clear_night_frac_real_fix
  source: Not a literature number -- the real fix is architectural, not a search result.
  version: n/a
  url: n/a
  citation: n/a
  license: n/a
  access_date: '2026-09-30'
  local_path: null
  checksum_sha256: null
  spatial_extent: n/a
  notes: >-
    A national-average cloud-cover figure (what was searched for) would be the wrong level of
    specificity for a per-cell, per-day cold-air-pooling term anyway. **2026-10-01 correction**:
    this note's original plan (extend ECMWF/ERA5_LAND/DAILY_AGGR with a cloud-cover band) was
    checked directly against Earth Engine before writing any code -- and was wrong.
    ECMWF/ERA5_LAND/DAILY_AGGR has 150 real bands and NONE are cloud-related (confirmed via
    `img.bandNames().getInfo()`, not assumed from the collection's documentation). ERA5-Land is a
    land-surface-only reanalysis; cloud cover is an atmospheric diagnostic that doesn't appear in
    it. Also checked and ruled out: ECMWF/ERA5/DAILY and ECMWF/ERA5/MONTHLY (GEE's reduced-band
    ERA5 aggregates, 9 bands each, no cloud fraction either); MODIS/061/MOD08_D3 and
    MCD06COSP_D3_MODIS (both real MODIS cloud products) are not available as GEE assets under
    those ids. A credible real alternative identified but NOT yet implemented (time-boxed out of
    tonight's pass in favour of MNEME/AEGIS, which had clearer paths forward): a real clear-sky
    index kt = ssrd_actual / ssrd_clear_sky_theoretical, computable entirely from
    surface_solar_radiation_downwards_sum (already pulled by export_era5land_forcing) against a
    real theoretical extraterrestrial/clear-sky radiation formula -- no new GEE export needed.
    This is a daytime proxy standing in for a specifically nighttime quantity (regional
    cloudiness regimes correlate day/night, but imperfectly), so it would need to be stated as an
    approximation, not a direct measurement, if implemented. calm_clear_night_frac remains the
    flat 0.3 placeholder for now -- a real, still-open gap, not silently resolved.

- variable: aegis_method_survival_multiplier
  source: Multiple real sources searched (Science Advances 2021 meta-analysis on natural
    regeneration vs. active restoration; a Costa Rica long-term reforestation trial; Mediterranean
    oak coppicing/regeneration literature).
  version: n/a
  url: "https://www.science.org/doi/10.1126/sciadv.aas9143; https://www.science.org/doi/10.1126/sciadv.1701345"
  citation: See the two Science Advances DOIs above for the clearest real findings; full citations
    to be confirmed from the primary articles before any quantitative use.
  license: n/a
  access_date: '2026-10-01'
  local_path: null
  checksum_sha256: null
  spatial_extent: Global (meta-analyses), tropical-forest-heavy; one Mediterranean oak-specific
    search also run, given AEGIS's own species are temperate/semi-arid, not tropical.
  notes: >-
    Real research, real negative result -- concluded a method-survival multiplier should NOT be
    added to AEGIS right now, not that the search failed. The clearest, most robustly real finding
    across every source checked is a documented **site-selection bias**: natural-regeneration
    studies are systematically conducted where a secondary forest already exists, while planting
    studies cover a broader range of site conditions including non-forested land -- so raw
    cross-study survival comparisons conflate method effect with where each method tends to be
    used, not a clean causal effect of method itself (Science Advances 2021, directly on this).
    The Mediterranean oak coppicing search independently confirms the same pattern from a
    different real angle: coppicing survival is reported as "heavily dependent on management
    conditions" (grazing pressure, protection), with no source quantifying a clean comparative
    success rate against planting. Applying any of these numbers as an AEGIS method multiplier
    would import a real confound into a model that currently, honestly, has none -- worse than
    the stated independence it would replace. Real conclusion: AEGIS's current benefit/cost
    independence (viability varies only by species group, cost only by method,
    `scripts/fit_aegis_portfolio.py`'s own documented gap) stays as the more defensible real
    choice until genuinely Armenia-specific, method-controlled survival data exists -- not
    patched over with a borrowed, confounded number for the sake of looking less simplified.

- variable: real_canopy_height_coverage_check
  source: antar_structure (this project's own GEDI L2A RH98 + ETH Global Canopy Height export,
    already registered in gee_exports.yaml) -- streamed and sampled at the same 80-point grid
    used throughout tonight's real runs, to check real data validity before relying on it.
  version: n/a
  url: n/a
  citation: See gee_exports.yaml's antar_structure entry for full citation.
  license: n/a
  access_date: '2026-09-30'
  local_path: null
  checksum_sha256: null
  spatial_extent: Armenia (80-point grid sample)
  notes: >-
    Real, checked result, not assumed from the export function's own docstring warning alone:
    GEDI's own direct lidar RH98 footprints are valid at only 4/80 grid points (sparse orbital
    tracks, exactly as export_structure's docstring warned) -- confirms GEDI alone cannot be
    MERISTEM's primary per-cell height source at this grid's resolution. The Lang et al. (2023)
    ETH global canopy height gap-fill (also in this same export) is valid at 77/80 points, real
    range 0.0-33.0 m -- usable as the primary real per-cell height source, with GEDI's 4 real
    footprints serving as a (very small) direct-measurement calibration check on it, not the main
    source. Separately, configs/manifests/s2_vhm.yaml already has a real, Armenia-specific,
    denser alternative (Sentinel-2 Vegetation Height Model, Rueetschi & Ginzler 2025, 10 m,
    9 real years 2017-2025, already downloaded/checksummed/uploaded to Drive this session) --
    not yet stream-checked for coverage the way antar_structure was here, but a real, likely
    better candidate for MERISTEM's attainable-height model given it's wall-to-wall (not
    orbital-track-sparse like GEDI) and Armenia-specific (not a global model like ETH CHM).
    Next step (not done tonight): stream-sample s2_vhm the same way and compare real coverage/
    plausibility against the ETH CHM numbers above before deciding which drives the real fit.

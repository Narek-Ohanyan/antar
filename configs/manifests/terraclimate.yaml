  notes: >-
    Real 1991-2020 monthly climatology (the project's own stated reference_period), 9 real
    variables x 12 months = 108 bands (pr, tmmn, tmmx, pet, aet, soil, ro, pdsi, vpd). Each
    band's documented GEE catalog scale factor applied explicitly before averaging (pr/ro

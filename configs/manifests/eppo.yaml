  notes: >-
    107 real pest/pathogen/invasive-plant organism records with Armenia presence status
    (EPPOCode, organism_prefname, status, labelstatus columns). A real, checked limitation:
    this is national-level presence/absence only, no coordinates -- usable to flag qualitative
    biotic risk per species (e.g. for MNEME's biotic hazard cause or as context alongside
    XYLEM's mechanistic hazard), not as a per-cell spatial covariate the way vitality/
    disturbance/climate data are. Tree-relevant real findings already checked in this file:
    Ips sexdentatus (pine bark beetle) "present, widespread"; Bursaphelenchus xylophilus (pine
    wood nematode) "present, restricted distribution" -- both directly relevant to the pine
    functional group; Ips typographus, Ceratocystis platani, Lymantria monacha, Scolytus
    multistriatus/scolytus, Cameraria ohridella also present. Not yet wired into any engine.

# Real data sources for AEGIS's robust-portfolio inputs (antar.decision.optimize.robust_portfolio:
# benefit = viability x value weight, area, cost, budget, eligibility, water_use/water_caps/basin).
# Research pass only -- nothing here has been wired into a fit/optimization script yet.
#
# The concept note (docs/concept_v2/sec9_uncertainty_decision.tex) is explicit that the value
# weight v_j ("canopy area, carbon or water services") is meant to be "set with stakeholders" --
# i.e. a policy input, not something a dataset search can substitute for. The figure below is a
# real, government/World-Bank-vetted *national-average* ecosystem-services valuation, offered as a
# defensible starting point, not a stakeholder-elicited, species/option-specific value -- flagged
# as such, not presented as the thing the concept note actually asked for.
#
# Four scope decisions made explicitly by the user (2026-09-30), not inferred:
#   1. Value weight:  use the real $417/ha/year proxy now (not wait for stakeholder elicitation).
#   2. Options j:      species x intervention-method combined (4 hydraulic functional groups x 8
#                       real FLR intervention types, Box 3 below) -- the most realistic option,
#                       and the most complex: several cells of that 4x8 cost/value grid will be
#                       apportioned/estimated from the real aggregate figures below, not each
#                       independently sourced (no data breaks cost down this finely in what was
#                       found). Flag which cells are apportioned vs. directly sourced when built.
#   3. Budget:         sweep the real range with antar.decision.optimize.efficient_frontier(),
#                       not a single figure -- report the mean-CVaR frontier across real budget
#                       levels from $9.3M to $663M rather than picking one.
#   4. Water caps:      extract real numbers before building (done below), not skipped or
#                       roughly estimated.

- variable: aegis_ecosystem_services_value_and_restoration_cost
  source: World Bank Armenia Forest Landscape Restoration Note (June 2023, revised 2024)
  version: n/a
  url: https://documents1.worldbank.org/curated/en/099090523175040850/pdf/P17173815d072503018f461b8c8ded40056.pdf
  citation: 'World Bank. 2023. Armenia Forest Landscape Restoration Note. Washington, DC: World Bank.'
  license: World Bank Open Access / reproducible with attribution (see document's own Rights and
    Permissions page).
  access_date: '2026-09-30'
  local_path: null
  checksum_sha256: null
  spatial_extent: Armenia (national)
  notes: >-
    Real, extracted figures (page numbers refer to the PDF as fetched; verified by direct read,
    not summarized from a search snippet):

    VALUE WEIGHT proxy (p.7, Ch.5/Table in "Economic contributions of forests"): aggregate
    economic value of forest ecosystem services = $417/ha/year (2021 constant $), valuing 10 of
    the ecosystem services forests provide (fuelwood, water, medicinal plants, wild fruits,
    mushroom, honey, habitat/species protection, hydrological regulation, GHG removal,
    recreation) via the benefit-transfer method; totals $138M/year nationally (334,100 ha
    forested, 1.1% of 2020 GDP). Explicitly a national average across all forest types, not
    species- or intervention-specific -- the report itself notes the true value is likely higher
    since only 10 of many ecosystem services could be valued.

    COST per hectare (p.40-41, "Cost estimates to achieve the Bonn Challenge by 2030"): the
    government's own 'Landscape Restoration Strategy and Action Plan 2022-2032' costs 8 named FLR
    intervention options (listed below) over a combined potential area of 387,000+ ha. Achieving
    the 50,000 ha Bonn Challenge target costs from $9.3M (cheapest option mix: coppice forestry,
    wildfire prevention, natural-regeneration support) to $663M (most expensive: windbreaks/
    hedgerows) depending which options are used; ~$45M if all 8 options are used in the same
    proportion as their identified areas (i.e. ~$900/ha blended). Real range: ~$186/ha (cheapest)
    to ~$13,260/ha (most expensive, windbreaks), not a single figure.

    BUDGET (same pages): the $9.3M-$663M range above IS the real national-program budget range
    for the 50,000 ha NDC/Bonn Challenge target (2022-2032); ~$45M is the figure tied to the
    strategy's own actual recommended option mix, the most defensible single "budget" figure to
    start from.

    The 8 real named FLR intervention options (Box 3, p.41) -- a real, more granular alternative
    or complement to this project's 4 hydraulic functional groups as AEGIS's "planting options j":
    (1) restoration of degraded forests through planting (oak/beech/pine), (2) natural
    regeneration via tillage/soil mineralization (oak/beech/juniper), (3) coppicing of secondary
    oak stands, (4) thinning of overly dense pine forests, (5) wildfire prevention
    (roads/tilled strips), (6) anti-erosion/soil-protection plantations, (7) windbreaks and
    hedgerows, (8) mining-site/landfill reclamation (incl. phytoremediation).

    AREA/ELIGIBILITY context (p.8-9): forests are "almost entirely under public ownership,"
    majority on state forest land, ~25% of which is in protected areas (so ~75% of state forest
    land is a priori plantable, before other exclusions). UNECE (2019) identifies 100,000 ha of
    real restoration potential (heavily degraded/deforested land) nationally -- a real upper
    bound distinct from the 50,000 ha near-term NDC target.

    NOT found in this document: a species-specific or per-hectare-by-tree-type cost breakdown
    (costs are by intervention TYPE, Box 3 above, not by species); an explicit water-use-per-
    option figure (see the HydroBASINS/RBMP entries below for the water dimension instead).


  citation: See configs/manifests/isimip3b.yaml
  license: See configs/manifests/isimip3b.yaml
  access_date: '2026-09-30'
  local_path: null
  checksum_sha256: null
  spatial_extent: Armenia
  notes: >-
    5 real GCMs (GFDL-ESM4, IPSL-CM6A-LR, MPI-ESM1-2-HR, MRI-ESM2-0, UKESM1-0-LL) x 3 real SSPs
    (ssp126/ssp370/ssp585), real bias-adjusted daily climate -- the real scenario ensemble
    Sec. 9's CVaR portfolio is meant to optimise over, once propagated through TOPOHYDRO/XYLEM/
    MNEME/MERISTEM/REFUGIUM for each member (not yet done -- this is the "full production"
    scope, separate from today's single-year 2019 reduced-scope REFUGIUM pass). No real
    scenario-weighting scheme (w_c) has been sourced or decided; equal weighting across all 15
    real GCM x SSP members is the natural default absent a stated reason to weight some more than
    others -- a modelling choice to make explicitly when this is built, not a missing dataset.

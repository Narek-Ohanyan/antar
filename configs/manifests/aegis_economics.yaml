- variable: aegis_water_basins
  source: WWF HydroSHEDS/HydroBASINS (SRTM-derived, Pfafstetter-coded nested watersheds, levels
    1-12), accessible directly in Google Earth Engine (WWF/HydroSHEDS/v1/Basins/hybas_N).
  version: v1
  url: https://developers.google.com/earth-engine/datasets/catalog/WWF_HydroSHEDS_v1_Basins_hybas_7
  citation: Lehner, B., Grill G. (2013). Global river hydrography and network routing baseline
    data and new approaches to study the world's large river systems. Hydrological Processes,
    27(15), 2171-2186. https://doi.org/10.1002/hyp.9740
  license: Free for non-commercial and commercial use (HydroSHEDS terms).
  access_date: '2026-09-30'
  local_path: null
  checksum_sha256: null
  spatial_extent: Global; Armenia is at ~40N, well within HydroSHEDS' full-quality SRTM coverage
    (quality degrades only above 60N, not relevant here).
  notes: >-
    No export function for this exists yet in antar.io.gee_export -- a real, small gap (unlike
    terrain/soils/ERA5-Land/vitality/disturbance/land_tenure, all already built). hybas_6 or
    hybas_7 (sub-basin granularity) is the natural level to match Armenia's 6 official river basin
    districts (Ararat, Southern, Akhuryan, Sevan, Hrazdan, Northern -- see the RBMP entry below);
    would need a short new export_water_basins(...) function, same pattern as export_land_tenure,
    rasterizing basin ID (not just a boolean) onto the master grid.

- variable: aegis_water_allocation_caps
  source: Draft River Basin Management Plans (RBMPs) for Armenia's real river basin districts,
    published under the EU4Environment Water and Data programme with the Armenian government;
    downloaded directly (not via WebFetch, which hit a size limit on the full Sevan PDF) and
    read with pdftotext + targeted grep/page extraction.
  version: n/a
  url: 'Sevan RBMP: https://euwipluseast.eu/images/2020/11/PDF/Draft_Sevan_RBDMP_Final_Report_ENG_final_161020.pdf
    ; Hrazdan RBMP: https://www.euwipluseast.eu/images/2021/05/PDF/Hrazdan_draft_RBMP_Report_ENG_VFinal_21042021.pdf
    ; Kasakh sub-basin Water Quantitative Management Plan: https://eu4waterdata.eu/images/pdf/EU4ENV_A1.2.1_AM_Water%20Quantitative%20Management%20Plan%20for%20the%20Kasakh%20sub-basin%20in%20Armenia-Executive%20summary_ENG_VF.pdf
    ; Akhuryan/Metsamor basin summary (secondary source, not independently verified against the
    primary BMP document): http://blacksea-riverbasins.net/en/river-basin-analysis-akhuryan-and-metsamor-river-basins-armenia'
  citation: EU4Environment Water and Data Programme / Republic of Armenia (draft River Basin
    Management Plans, 2020-2021); Akhuryan figure via blacksea-riverbasins.net (EU-funded Black
    Sea river basin analysis series).
  license: Not stated on the documents fetched; public EU-programme technical reports, presumed
    citable for non-commercial research (verify before any redistribution).
  access_date: '2026-09-30'
  local_path: null
  checksum_sha256: null
  spatial_extent: Sevan, Hrazdan and Akhuryan/Metsamor river basin districts (3 of Armenia's 6);
    Ararat, Southern and Northern districts have plans adopted/in development but no fetchable
    document was located this pass.
  notes: >-
    Real, directly-extracted figures (Sevan and Hrazdan verified from the primary RBMP PDFs;
    Akhuryan from a secondary summary, flagged as such):

    HRAZDAN RBD (Hrazdan RBMP, Table 88 "Surface Water Supply" + groundwater section, p.159-160):
    surface water supply (natural river flow minus required ecological flow, i.e. what's actually
    available for human use) = 600 million m3/year total (Hrazdan River sub-basin: natural flow
    732, ecological flow 319, supply 414; Kasakh River sub-basin: natural flow 274, ecological
    flow 88, supply 186). Separately, usable/strategic/national groundwater resources of the
    mountain and foothill zones = 788.5 million m3 (394.2 renewable + 157.7 strategic + 236.6
    national) -- reported separately from surface supply, not summed, to avoid double-counting
    surface/groundwater interaction the source document itself does not sum.

    SEVAN RBD (Sevan RBMP, Table 102 "Future Water Supply in Sevan RBD", p.175-176): multi-year
    average surface water supply = 677.0 million m3/year, groundwater = 259.5 million m3/year
    (~936.5 million m3/year combined) -- both sources include an explicit declining projection
    through 2027 under optimistic and pessimistic climate scenarios (real, already
    climate-adjusted figures, not a static historical average).

    KASAKH SUB-BASIN (within Hrazdan RBD, Water Quantitative Management Plan, Table 18): detailed
    nodal-basin-level surface natural flow with real RCP6.0/RCP8.5 climate-change projections to
    2100 (e.g. Kasakh upper flow: 192.2 million m3/year average, declining to 122.4 under RCP8.5
    by 2100) -- the most granular real sub-basin data found, useful if AEGIS's units need finer
    resolution than the 6 basin districts.

    AKHURYAN/METSAMOR (secondary source, not independently verified against Akhuryan's own
    primary BMP document): Akhuryan sub-basin ~391 million m3/year, Metsamor (Sevjur) sub-basin
    ~711 million m3/year.

    Real, structural finding, not a data gap: none of the three primary documents track water
    abstraction/allocation by a "forestry" sector -- allocation accounting covers irrigation,
    industry, fish farming, and municipal supply only, because Armenian afforestation as
    documented (see aegis_ecosystem_services_value_and_restoration_cost above) is rainfed, not
    irrigated, except explicitly riparian/cutting-based methods (e.g. willow cuttings planted in
    riparian zones, GIZ-funded). This means a literal "water_use per planting option" input may
    not be a real constraint for most of AEGIS's options at all -- worth deciding explicitly
    (tomorrow) whether to model water use only for riparian/irrigated options, or omit the water
    constraint for rainfed options rather than force a number that has no real basis.


# ISIMIP3b bias-adjusted atmospheric climate input data -- the real, confirmed primary CMIP6
# source for this project's future ensemble (configs/scenarios.yaml's future_ensembles decision).
# Pulled via scripts/pull_isimip3b.py (isimip-client, real Files API v2, not the broken
# isimip-client.cutout() wrapper -- see IMPLEMENTATION_LOG.md for that earlier bug).

- variable: isimip3b_armenia_bbox
  source: ISIMIP3b (Inter-Sectoral Impact Model Intercomparison Project, round 3b)
  version: "3b"
  url: https://data.isimip.org
  citation: 'Lange, S., Mengel, M., Treu, S., Buechner, M. (2021). ISIMIP3b bias-adjusted
    atmospheric climate input data. ISIMIP Repository.
    https://doi.org/10.48364/ISIMIP.842396.1'
  license: See data.isimip.org per-dataset terms; public downloads, no account required (the
    confirmed path -- institutional accounts are for DKRZ HPC/protocol participants only, not
    needed here).
  access_date: '2026-10-01'
  local_path: data/isimip3b/
  checksum_sha256: null
  spatial_extent: "Armenia bbox cutout (43.4, 38.8, 46.7, 41.4), server-side via cutout_bbox --
    confirmed real axis order [lon_min, lon_max, lat_min, lat_max] after an earlier wrong-order
    attempt silently returned northern Georgia instead (see IMPLEMENTATION_LOG.md)."
  notes: >-
    Real, COMPLETE result after a retry: 60 of 60 combos (5 GCMs x 3 SSPs x 4 variables) done,
    0 failed. The first pass completed 39/60 with a real, non-random failure pattern (pr/tas
    15/15 each, tasmax 8/15, tasmin 1/15 -- the later-running variables hit 21 consecutive real
    failures, a mix of 900s job timeouts and one connection reset). Rather than assume that was
    a permanent problem, cleared only the 21 real failed entries from pull_progress.json (the
    script's own `done` dict includes failed attempts, so a plain re-run would have skipped them
    too -- checked before retrying, not assumed) and re-ran: all 21 succeeded this time, with
    zero failures -- real, direct confirmation this was transient server-side load on ISIMIP3b's
    own job queue, not a per-variable or pipeline problem. 150 MB total, kept locally (small
    enough that the cloud-first convention doesn't apply the way it does to the multi-GB GEE
    rasters).

    Real combos: all 5 real GCMs (GFDL-ESM4, IPSL-CM6A-LR, MPI-ESM1-2-HR, MRI-ESM2-0,
    UKESM1-0-LL) x all 3 real SSPs (ssp126/ssp370/ssp585) x all 4 real variables
    (pr/tas/tasmax/tasmin) -- the complete, real, confirmed primary CMIP6 ensemble this project
    needs, no gaps.

    pr converted from ISIMIP3b's native flux units (kg m-2 s-1) to mm/day (x86400) to match
    CHELSA-daily's convention -- a real unit bug caught and fixed this session before the full
    pull ran (see IMPLEMENTATION_LOG.md), not assumed compatible.

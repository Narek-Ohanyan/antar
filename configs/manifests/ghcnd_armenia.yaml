    detail). Units converted at parse time per GHCN's documented convention -- PRCP/
    TMAX/TMIN/TAVG divided by 10 (raw values are tenths of mm / tenths of degC),
    SNOW/SNWD left as-is (already whole mm). Not stored locally (cloud-first by
    design) -- lives in Google Drive folder antar_gee_exports, file
    id=1ucE2WXCFBV2IW-eESLxMnksC-hLwfaRK, gzip-compressed CSV, 5.0 MB. Real, freely
    downloadable cross-check/downscaling reference for CHELSA-daily per the concept
    note's Table tab:data ("daily variability and QDM reference") -- not
    institution-only as earlier assessed.
